<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuğba'yı Seviyor Musun? 🌸</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffccd5 0%, #ffe5ec 50%, #e8dff5 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 154, 162, 0.2);
            max-width: 420px;
            width: 90%;
            position: relative;
            border: 3px solid #ffb3c1;
        }

        h1 {
            color: #ff5c8a;
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background-color: #a3c4f3;
            color: #2b2d42;
            box-shadow: 0 4px 15px rgba(163, 196, 243, 0.4);
            z-index: 10;
        }

        #yesBtn:hover {
            background-color: #8ecae6;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #ffb5a7;
            color: #2b2d42;
            box-shadow: 0 4px 15px rgba(255, 181, 167, 0.4);
        }

        /* Başarı Ekranı */
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.8s ease forwards;
        }

        /* Büyütülmüş Tek Kalp Görsel Alanı */
        .single-heart-container {
            width: 250px;
            height: 235px;
            position: relative;
            overflow: hidden;
            /* Saf CSS Kalp Maskesi (Oranları büyütüldü) */
            clip-path: path('M125,37 C112,12 87,0 56,0 C25,0 0,25 0,56 C0,100 50,137 125,200 C200,137 250,100 250,56 C250,25 225,0 194,0 C163,0 138,12 125,37 Z');
            box-shadow: 0 10px 25px rgba(255, 143, 171, 0.5);
            margin-bottom: 20px;
            background-color: #ff8fab;
        }

        .single-heart-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .success-screen h2 {
            color: #ff5c8a;
            font-size: 22px;
            margin-top: 5px;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <div id="questionSection">
            <h1>Asil, Tuğba'yı seviyor musun? 🌸</h1>
            <div class="buttons" id="buttonArea">
                <button id="yesBtn" onclick="sayYes()">Evet</button>
                <button id="noBtn" onclick="moveNo()">Hayır</button>
            </div>
        </div>

        <div class="success-screen" id="successSection">
            <!-- Büyütülmüş Tek Kalp Şeklindeki Görsel -->
            <div class="single-heart-container">
                <img src="https://i.pinimg.com/736x/5c/a0/10/5ca0109263b626398ce2a3359b7ec8da.jpg" alt="Birlikte Fotoğrafımız">
            </div>
            <h2>Tuğba da seni çok seviyor! ☁️🤍</h2>
        </div>
    </div>

    <script>
        let noClickCount = 0;
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        function moveNo() {
            noClickCount++;

            let currentScale = Math.max(0.3, 1 - (noClickCount * 0.1));
            noBtn.style.position = 'fixed';
            const randomX = Math.random() * (window.innerWidth - 140);
            const randomY = Math.random() * (window.innerHeight - 80);
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.transform = `scale(${currentScale})`;

            let yesScale = 1 + (noClickCount * 0.11); 
            yesScale = Math.min(yesScale, 2.5); 
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function sayYes() {
            document.getElementById('questionSection').style.display = 'none';
            document.getElementById('successSection').style.display = 'flex';
        }
    </script>
</body>
</html>
